<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Tracker</title>
</head>
<body>
    <h1>Manga Tracker</h1>
    <a href="{{ url_for('add_manga') }}">Add New Manga</a>
    <ul>
        {% for manga in manga_list %}
            <li>
                <strong>{{ manga['title'] }}</strong> (Chapters: {{ manga['chapter_count'] }})
                <a href="{{ url_for('delete_manga', id=manga['id']) }}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
