<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetSoft MangaPill Chapter Tracker - Login</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='auth-styles.css') }}">
</head>
<body>
    <div class="wrap">
        <h1>Login</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flashes">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} flash-message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% endwith %}
        <form method="POST">
            <label for="username">Username:</label>
            <input type="text" name="username" required><br><br>

            <label for="password">Password:</label>
            <input type="password" name="password" required><br><br>

            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>.</p>
        <footer class="site-footer">
            &copy; 2024 SweetSoft, Ryan Sweet. All Rights Reserved.
        </footer>
    </div>
</body>
</html>
